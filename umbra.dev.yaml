schema_version: 1
component: axio/local
hosts: [macos, linux, windows]
tools:
  - {executable: cargo, version: "1.98.1"}
  - {executable: rustc, version: "1.98.1"}
actions:
  prepare:
    - {executable: cargo, arguments: [fetch, --locked], cwd: .}
  check:
    - {executable: cargo, arguments: [fmt, --all, --, --check], cwd: .}
    - {executable: cargo, arguments: [clippy, --all-targets, --locked, --, "-D", warnings], cwd: .}
    - {executable: cargo, arguments: [test, --locked], cwd: .}
  build:
    - {executable: cargo, arguments: [build, --release, --locked], cwd: .}
fixtures: {kind: synthetic, services: []}
previews: []
manual_gates:
  - Agent launch/tool-use/config-restore matrix requires explicit native harness testing.
  - Windows and Linux source acceptance requires checks on those hosts.
